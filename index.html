<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>LaporMas · SMAN 6 Surakarta</title>
    <meta name="description" content="Sistem Laporan Harian Staf Tata Usaha SMA Negeri 6 Surakarta">

    <!-- Google Fonts: Fraunces (display/brand) + Plus Jakarta Sans (UI/body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['Fraunces', 'serif'],
                    },
                    colors: {
                        navy: {
                            50:  '#eef1f8',
                            100: '#dce2f1',
                            200: '#b3c0e0',
                            300: '#8194c7',
                            400: '#5468a6',
                            500: '#374c86',
                            600: '#2a3b6b',
                            700: '#212f56',
                            800: '#182242',
                            900: '#11182f',
                            950: '#0a0e1f',
                        },
                        gold: {
                            50:  '#faf6ea',
                            100: '#f1e6c2',
                            300: '#dcbb6d',
                            400: '#cca542',
                            500: '#b48a2e',
                            600: '#946e22',
                        },
                    },
                    boxShadow: {
                        soft: '0 1px 2px rgba(15,23,42,.04), 0 8px 24px -12px rgba(15,23,42,.10)',
                    },
                }
            }
        }
    </script>

    <style>
        @keyframes toastIn { from { opacity: 0; transform: translateY(-6px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes toastOut { to { opacity: 0; transform: translateY(-6px) scale(.98); } }
        .animate-toast-in { animation: toastIn .18s ease-out; }
        .animate-toast-out { animation: toastOut .18s ease-in forwards; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeInUp .25s ease-out; }

        .modal-backdrop { background: rgba(10, 14, 31, .55); backdrop-filter: blur(2px); }

        ::-webkit-scrollbar { height: 8px; width: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }

        [data-tab-panel] { display: none; }
        [data-tab-panel].active { display: block; }
    </style>
</head>
<body class="h-full font-sans antialiased text-slate-800 bg-slate-50 selection:bg-navy-700 selection:text-white">

    <div id="app" class="min-h-full flex flex-col">
        <!-- Loading State -->
        <div id="loading-spinner" class="fixed inset-0 bg-navy-950/90 flex flex-col items-center justify-center z-[200]">
            <div class="flex flex-col items-center gap-3.5">
                <div class="h-11 w-11 rounded-full border-[3px] border-gold-400/40 border-t-gold-400 animate-spin"></div>
                <p class="text-xs font-medium text-navy-200 tracking-wide">Memuat LaporMas…</p>
            </div>
        </div>

        <!-- Dynamic Content Mount Point -->
        <div id="main-content" class="flex-grow flex flex-col"></div>
    </div>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
